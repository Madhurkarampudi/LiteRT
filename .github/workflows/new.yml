name: Build LiteRT Android Artifacts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_android_on_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK (r25.2)
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-35
            build-tools;35.0.1
            cmdline-tools;latest
            ndk;25.2.9519653

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Create /opt/android/sdk symlink (repo expects this)
        run: |
          sudo mkdir -p /opt/android
          sudo ln -sfn "$ANDROID_HOME" /opt/android/sdk
          ls -la /opt/android/sdk
          ls -la /opt/android/sdk/ndk/25.2.9519653

      - name: Export Android env
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.8.1
        with:
          bazel-version: "7.4.1"

      - name: Print Bazel version
        run: bazel version

      - name: Verify NDK path
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" && echo "NDK OK" || (echo "NDK missing" && exit 1)

      - name: Clean Bazel cache
        run: bazel clean --expunge

      - name: Build Android artifacts
        run: |
          bazel build -c opt \
            --config=android_arm64 \
            --define=KLEIDIAI_ENABLE_I8MM=false \
            //litert/kotlin:litert_kotlin_api \
            //tflite/java:tensorflow-lite-api \
            //tflite/java:tensorflow-lite \
            //tflite/java:tensorflow-lite-gpu-api \
            //tflite/java:tensorflow-lite-gpu

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            bazel-bin/litert/kotlin/liblitert_kotlin_api.jar
            bazel-bin/tflite/java/tensorflow-lite-api.aar
            bazel-bin/tflite/java/tensorflow-lite.aar
            bazel-bin/tflite/java/tensorflow-lite-gpu-api.aar
            bazel-bin/tflite/java/tensorflow-lite-gpu.aar
