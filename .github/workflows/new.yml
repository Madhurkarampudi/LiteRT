name: Build LiteRT Android Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_android_on_linux:
    name: Build Android Artifacts on Linux
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Java (required by Bazel + Android tools)
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # Android SDK + NDK
      # ------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            ndk;25.2.9519653
            build-tools;35.0.1
            platforms;android-35
            platform-tools
            cmdline-tools;latest

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # ------------------------------------------------------------
      # Export Android environment variables
      # ------------------------------------------------------------
      - name: Export Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      # ------------------------------------------------------------
      # Create stable SDK path expected by Bazel WORKSPACE
      # ------------------------------------------------------------
      - name: Create /opt/android/sdk symlink
        run: |
          sudo mkdir -p /opt/android
          sudo ln -sf "$ANDROID_HOME" /opt/android/sdk
          ls -la /opt/android/sdk
          ls -la /opt/android/sdk/ndk/25.2.9519653

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" && echo "NDK OK" || exit 1

      # ------------------------------------------------------------
      # Bazel
      # ------------------------------------------------------------
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.8.1

      - name: Show Bazel version
        run: bazel --version

      - name: Clean Bazel cache
        run: bazel clean --expunge

      # ------------------------------------------------------------
      # Build LiteRT Android artifacts
      # ------------------------------------------------------------
      - name: Build Android Artifacts with Bazel
        run: |
          bazel build -c opt \
            --action_env=ANDROID_HOME="$ANDROID_HOME" \
            --action_env=ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            --cxxopt=-std=c++17 \
            --config=android_arm64 \
            --define=KLEIDIAI_ENABLE_I8MM=false \
            //litert/kotlin:litert_kotlin_api \

      # ------------------------------------------------------------
      # Upload outputs
      # ------------------------------------------------------------
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            bazel-bin/litert/kotlin/liblitert_kotlin_api.jar
            bazel-bin/tflite/java/tensorflow-lite-api.aar
            bazel-bin/tflite/java/tensorflow-lite.aar
            bazel-bin/tflite/java/tensorflow-lite-gpu-api.aar
            bazel-bin/tflite/java/tensorflow-lite-gpu.aar
