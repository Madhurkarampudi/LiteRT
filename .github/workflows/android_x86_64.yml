name: Build LiteRT for Android x86_64
on:
  push:
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main

jobs:
  build-android-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Required for Android toolchain

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Specify the NDK version expected by TF/your project

      - name: Install Bazelisk (as Bazel)
        run: |
          BAZELISK_VERSION="v1.19.0" # Or check for the latest version
          DOWNLOAD_URL="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-amd64"
          mkdir -p "$HOME/bin"
          wget -qO "$HOME/bin/bazel" "${DOWNLOAD_URL}"
          chmod +x "$HOME/bin/bazel"
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "Bazel version (from Bazelisk):"
          bazel version

      - name: Build with Bazel
        run: |
          bazel build --config=android_x86_64 //litert/litert/vendors/intel_openvino/...
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
